<style>
:root{--bg:#f4f6f8;--sidebar:#111820;--sidebar2:#17212b;--panel:#fff;--panel-soft:#f8fafb;--line:#e2e7eb;--text:#17212b;--muted:#74808b;--gold:#c99732;--gold2:#e6bd5c;--danger:#c95757;--ok:#2f9a68;--blue:#3b82f6;--r:16px;--shadow:0 10px 32px rgba(19,31,43,.07);--side:280px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh}.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--sidebar),#0d141b);border-right:1px solid rgba(255,255,255,.06);padding:22px 16px;overflow:auto;color:#fff}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 23px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#221a0d;font-family:Montserrat;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(201,151,50,.22)}.brand b{font-family:Montserrat;font-size:15px;display:block;letter-spacing:.01em}.brand span{font-size:11px;color:#8997a4;display:block;margin-top:3px}.nav-label{font-size:10px;color:#667582;text-transform:uppercase;letter-spacing:.14em;font-weight:700;padding:14px 10px 7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aab5be;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:10px;transition:.2s}.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.active{background:linear-gradient(90deg,rgba(201,151,50,.18),rgba(201,151,50,.06));color:#f4d48d;box-shadow:inset 3px 0 0 var(--gold)}.nav-icon{width:19px;height:19px;display:grid;place-items:center;font-size:15px;opacity:.95}.side-foot{margin-top:22px;padding:15px 10px 6px;border-top:1px solid rgba(255,255,255,.08);color:#6f7d89;font-size:11px;line-height:1.6}.main{padding:0;min-width:0}.topbar{height:72px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.topbar-left{display:flex;align-items:center;gap:13px}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--text)}.topbar-right{display:flex;align-items:center;gap:10px}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(47,154,104,.1)}.publish-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-right:7px}.workspace{padding:30px 32px 50px;max-width:1440px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:22px;align-items:flex-end;margin-bottom:22px}.page-head h1{font-family:Montserrat;margin:0;font-size:clamp(25px,3vw,34px);letter-spacing:-.025em}.page-head p{margin:7px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 15px;border-radius:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.02)}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(20,32,43,.07)}.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#241c0e;border-color:transparent}.btn.ghost{background:#fff}.status-wrap{margin-bottom:22px}.status{font-size:13px;color:#63707b;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;min-height:43px;display:flex;align-items:center;gap:9px}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#9aa6b0;flex:none}.status.ok{color:#277c58;background:#f6fcf9;border-color:#d6efe3}.status.ok:before{background:var(--ok)}.status.bad{color:#a84444;background:#fff8f8;border-color:#f2dada}.status.bad:before{background:var(--danger)}.page{display:none}.page.active{display:block}.dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.metric-icon{width:38px;height:38px;border-radius:10px;background:#f5f1e8;display:grid;place-items:center;font-size:18px}.metric .num{font-family:Montserrat;font-size:25px;font-weight:800;line-height:1}.metric .label{font-size:12px;color:var(--muted);margin-top:7px}.quick-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.quick-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-link{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;cursor:pointer;text-align:left;transition:.2s}.quick-link:hover{border-color:#d4bd86;box-shadow:0 8px 22px rgba(25,38,50,.06);transform:translateY(-1px)}.quick-link b{display:block;font-size:13px;margin-bottom:4px}.quick-link span{font-size:12px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}.card-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #edf0f2}.card h2{font-family:Montserrat;font-size:17px;margin:0}.card-sub{font-size:12px;color:var(--muted);margin-top:5px}.card h3{font-family:Montserrat;font-size:14px;margin:20px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid.one{grid-template-columns:1fr}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-size:11px;font-weight:700;color:#5f6973;text-transform:uppercase;letter-spacing:.055em}input,textarea{width:100%;border:1px solid #dce2e6;background:#fbfcfd;color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;outline:none;transition:.18s}textarea{min-height:112px;resize:vertical}input:hover,textarea:hover{border-color:#cfd6db}input:focus,textarea:focus{border-color:#c69a40;background:#fff;box-shadow:0 0 0 3px rgba(201,151,50,.10)}.image-row{display:grid;grid-template-columns:1fr auto;gap:8px}.upload{display:none}.upload-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 13px;border:1px solid #d8dee2;border-radius:10px;cursor:pointer;white-space:nowrap;background:#fff;font-size:12px;font-weight:700;color:#394550}.upload-btn:hover{background:#f7f8f9}.preview{width:100%;height:190px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#eef1f3;margin-top:9px}.repeat{border:1px solid #e8ecef;border-radius:13px;padding:18px;margin-top:14px;background:#fcfdfd}.repeat:first-child{margin-top:0}.repeat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.pill{display:inline-flex;align-items:center;font-size:10px;font-weight:800;padding:6px 9px;border-radius:999px;background:#f5efe1;color:#9a701c;text-transform:uppercase;letter-spacing:.05em}.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}.section-note{font-size:12px;color:var(--muted);background:#f7f9fa;border:1px solid #e7ecef;padding:11px 13px;border-radius:9px;margin-bottom:15px}.mobile-top{display:none}.save-float{display:none}.unsaved{color:#a06f12}.unsaved .live-dot{background:#dba63b}.empty-admin{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1180px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:1fr}}
@media(max-width:900px){:root{--side:0px}.shell{display:block}.side{display:none}.topbar{height:auto;min-height:62px;padding:10px 16px}.crumb{display:none}.workspace{padding:20px 15px 90px}.mobile-top{display:flex;position:sticky;top:62px;z-index:30;background:rgba(244,246,248,.96);backdrop-filter:blur(12px);padding:9px 15px;margin:0 -15px 18px;border-bottom:1px solid var(--line);gap:7px;overflow:auto}.mobile-top button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#5b6670;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700}.mobile-top button.active{background:#19232c;color:#fff;border-color:#19232c}.page-head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.actions{display:none}.card{padding:17px}.image-row{grid-template-columns:1fr}.upload-btn{width:100%}.dashboard-grid{grid-template-columns:1fr 1fr}.quick-list{grid-template-columns:1fr}.save-float{display:flex;position:fixed;left:15px;right:15px;bottom:14px;z-index:60}.save-float .btn{width:100%;padding:13px}.topbar-right .btn{display:none}}
@media(max-width:520px){.dashboard-grid{grid-template-columns:1fr}.topbar{padding:9px 13px}.workspace{padding-left:12px;padding-right:12px}.mobile-top{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.metric{padding:15px}}
</style>

<script>
const API='/api/content', UPLOAD='/api/upload';
let token=sessionStorage.getItem('klc_admin_token')||'';
let data=null;
const pageDefs=[['dashboard','Dashboard','⌂'],['general','General','⚙'],['hero','Hero','◫'],['projects','Projects','▦'],['about','About','◉'],['services','Services','◆'],['news','News','▤'],['contact','Contact','✉']];
const pageMeta={dashboard:['Dashboard','Manage your website content from one place.'],general:['General Settings','Website identity, SEO and footer content.'],hero:['Hero Section','Manage the first section visitors see on the website.'],projects:['Projects','Update project listings, descriptions and project imagery.'],about:['About Us','Manage company profile and mission content.'],services:['Services','Update the services displayed on the website.'],news:['Latest News','Manage news cards and article content.'],contact:['Contact & Location','Update contact details, WhatsApp and map information.']};
const defaults={"meta": {"title": "KLConstruction Sdn Bhd", "description": "KLConstruction Sdn Bhd - Construction, renovation and project delivery in Malaysia.", "companyMain": "KL Construction", "companySub": "Sdn Bhd"}, "hero": {"eyebrow": "Construction · Renovation · Project Delivery", "titleHtml": "Built with <span>purpose.</span><br>Delivered with precision.", "description": "KLConstruction Sdn Bhd provides dependable construction and project solutions for residential, commercial and industrial developments across Malaysia.", "image": "", "metaLeftHtml": "Kuala Lumpur<br><strong>Malaysia</strong>", "metaRightHtml": "Built on<br><strong>Quality</strong>"}, "projectsSection": {"kicker": "Selected Projects", "titleHtml": "Projects built<br>with precision.", "note": "A selection of construction and development work across Kuala Lumpur and Selangor."}, "projects": [{"title": "Commercial Development", "location": "Kuala Lumpur", "tag": "Project 01 · Commercial", "description": "Construction coordination and finishing works for a commercial development in Kuala Lumpur.", "cardImage": "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1800&q=92", "detailImage": "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2000&q=94"}, {"title": "Structural Construction", "location": "Selangor", "tag": "Project 02 · Structural", "description": "Structural and building works with a strong focus on safety, coordination and quality control.", "cardImage": "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1800&q=92", "detailImage": "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2000&q=94"}, {"title": "Industrial Works", "location": "Klang Valley", "tag": "Project 03 · Industrial", "description": "Industrial site works and construction support for an operational facility in Klang Valley.", "cardImage": "https://images.unsplash.com/photo-1541888946425-d81bb19240f5e?auto=format&fit=crop&w=1800&q=92", "detailImage": "https://images.unsplash.com/photo-1541888946425-d81bb19240f5e?auto=format&fit=crop&w=2000&q=94"}, {"title": "Office Interior Fit-Out", "location": "Kuala Lumpur", "tag": "Project 04 · Fit-Out", "description": "Commercial interior upgrading with coordinated architectural, finishing and M&E works.", "cardImage": "https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1800&q=92", "detailImage": "https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=2000&q=94"}, {"title": "Residential Build", "location": "Petaling Jaya", "tag": "Project 05 · Residential", "description": "Residential construction and upgrading works focused on quality, functionality and finishing.", "cardImage": "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=92", "detailImage": "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2000&q=94"}, {"title": "Site & Civil Works", "location": "Selangor", "tag": "Project 06 · Civil", "description": "On-site coordination and civil works with structured progress tracking and safety awareness.", "cardImage": "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1800&q=92", "detailImage": "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=2000&q=94"}], "about": {"image": "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1400&q=84", "kicker": "About KLConstruction", "titleHtml": "Reliable construction.<br>Clear project delivery.", "paragraph1": "KLConstruction Sdn Bhd is a Malaysia-based construction company focused on delivering reliable workmanship, coordinated site execution and practical solutions for every project.", "paragraph2": "From early planning to construction and final handover, we work closely with clients, consultants and project teams to keep the process clear, structured and accountable.", "missionTitle": "Our Mission", "missionText": "To build long-term trust through quality workmanship, responsible project management and consistent delivery.", "linkText": "View project details →"}, "servicesSection": {"kicker": "Our Services", "titleHtml": "Construction expertise<br>you can rely on.", "note": "Construction solutions tailored to residential, commercial and industrial project requirements."}, "services": [{"label": "01 / Construction", "title": "General Construction", "description": "Residential, commercial and industrial construction with coordinated site execution."}, {"label": "02 / Renovation", "title": "Renovation & Upgrading", "description": "Practical improvement works, refurbishment and upgrading for existing properties."}, {"label": "03 / Management", "title": "Project Coordination", "description": "Planning, scheduling, contractor coordination, progress monitoring and site communication."}], "projectDetailsSection": {"kicker": "Project Details", "titleHtml": "Selected project<br>experience.", "note": "Explore selected project work and construction capabilities."}, "newsSection": {"kicker": "Latest News", "titleHtml": "Project updates &<br>industry insights.", "intro": "A closer look at construction progress, coordination, quality, workplace delivery and practical site considerations.", "moreTitle": "More News & Updates"}, "news": [{"title": "Commercial Development Reaches a Key Coordination Milestone", "image": "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1800&q=92"}, {"title": "Structural Works Move Forward with Safety and Quality in Focus", "image": "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1800&q=92"}, {"title": "Industrial Site Progress Shows Strong Coordination Across Trades", "image": "https://images.unsplash.com/photo-1541888946425-d81bb19240f5e?auto=format&fit=crop&w=1800&q=92"}, {"title": "Office Fit-Out Takes Shape Through Careful Planning and Finishing", "image": "https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1800&q=92"}, {"title": "Material Checks Help Protect Build Quality on Site", "image": "https://images.unsplash.com/photo-1531834685032-c34bf0d84c77?auto=format&fit=crop&w=1600&q=92"}, {"title": "Residential Build Focuses on Practical Details and Lasting Quality", "image": "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=92"}, {"title": "Site and Civil Works Improve Access and Project Readiness", "image": "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1600&q=92"}, {"title": "Clear Site Communication Keeps Multiple Workstreams Moving", "image": "https://images.unsplash.com/photo-1581094794329-c8112a89af12?auto=format&fit=crop&w=1600&q=92"}, {"title": "Planning Reviews Help Teams Identify Issues Before Site Work Begins", "image": "https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=1600&q=92"}, {"title": "Final Quality Reviews Support a Smoother Project Handover", "image": "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=92"}], "newsArticleParagraphs": ["Every construction project reaches points where good coordination becomes just as important as physical progress. At this stage, the work is not only about completing visible items; it is also about making sure information, sequencing, access, safety requirements and workmanship standards continue to align. For KLConstruction, that means reviewing what has been completed, what is coming next and whether any interface between trades needs to be resolved before it affects the programme.", "A structured review normally begins with the latest drawings, site conditions and the work sequence. Teams compare planned activities against actual progress, verify access requirements and identify areas where one trade may affect another. This is especially important around structural openings, M&E routes, finishes, temporary works and handover zones. Resolving those items early helps reduce unnecessary rework and keeps the next phase more predictable.", "Quality checks form another important part of the process. Rather than waiting until the end of a project, inspections are more useful when they are carried out throughout the work. Materials can be checked before installation, completed areas can be reviewed before they are covered, and workmanship can be assessed against the agreed details. This approach helps the team correct small issues while they are still easy to manage.", "Safety and housekeeping also remain part of day-to-day delivery. Clear access routes, organised material storage and well-planned work areas make the site easier to manage and reduce unnecessary disruption between teams. When several work activities are happening at the same time, communication becomes particularly important. Short coordination discussions and clear responsibilities help everyone understand what can proceed safely and what must wait.", "Good project delivery is therefore a combination of planning, technical coordination and consistent follow-through. Visible progress matters, but the quality of the decisions behind that progress matters just as much. By keeping information current and reviewing the work in manageable stages, the project team can maintain better control over quality, programme and site conditions.", "The objective is straightforward: complete each stage with enough clarity that the next team can begin without avoidable uncertainty. That discipline supports a smoother construction process and a stronger final result. As the project continues, the same checks are repeated at the appropriate stages so that quality, safety and coordination remain part of the work from early construction through final handover."], "contact": {"kicker": "Contact Us", "titleHtml": "Talk to our<br>project team.", "note": "For project enquiries, site discussions or company information, contact KLConstruction directly.", "companyName": "KLConstruction Sdn Bhd", "office": "Klang, Selangor, Malaysia", "phone": "+60 12-345 6789", "email": "hello@klconstruction.com", "hoursHtml": "Monday – Saturday<br>9:00 AM – 6:00 PM", "whatsapp": "60123456789", "whatsappMessage": "Hi KLConstruction, I would like to enquire about a project.", "mapQuery": "Klang, Selangor, Malaysia", "mapLabel": "Klang, Selangor"}, "footer": {"copyright": "© {year} KL Construction Sdn Bhd. All rights reserved."}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function deepMerge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;if(a&&typeof a==='object'){const o={...a};for(const k in b||{})o[k]=deepMerge(a[k],b[k]);return o}return b===undefined?a:b}
function get(path){return path.split('.').reduce((o,k)=>o?.[k],data)}
function set(path,val){const p=path.split('.');let o=data;p.slice(0,-1).forEach(k=>o=o[k]);o[p.at(-1)]=val}
function field(path,label,type='text',full=false){const v=get(path)??'';return `<div class="field ${full?'full':''}"><label>${esc(label)}</label>${type==='textarea'?`<textarea data-path="${path}">${esc(v)}</textarea>`:`<input data-path="${path}" value="${esc(v)}">`}</div>`}
function imageField(path,label){const v=get(path)||'';const id='u_'+path.replace(/[^a-z0-9]/gi,'_');return `<div class="field full"><label>${esc(label)}</label><div class="image-row"><input data-path="${path}" value="${esc(v)}" placeholder="Image URL"><label class="upload-btn" for="${id}">Upload image</label><input class="upload" id="${id}" type="file" accept="image/*" data-upload-path="${path}"></div><img class="preview" data-preview="${path}" src="${esc(v)}" onerror="this.style.display='none'" ${v?'':'style="display:none"'}><div class="hint">Upload replaces this field with the public image URL.</div></div>`}
function card(title,html,sub=''){return `<section class="card"><div class="card-header"><div><h2>${title}</h2>${sub?`<div class="card-sub">${sub}</div>`:''}</div></div>${html}</section>`}
function projectBlock(i){const p=`projects.${i}`;return `<div class="repeat"><div class="repeat-head"><span class="pill">Project ${String(i+1).padStart(2,'0')}</span></div><div class="grid">${field(p+'.title','Project title')}${field(p+'.location','Location')}${field(p+'.tag','Detail label', 'text',true)}${field(p+'.description','Description','textarea',true)}${imageField(p+'.cardImage','Project card image')}${imageField(p+'.detailImage','Project detail image')}</div></div>`}
function serviceBlock(i){const p=`services.${i}`;return `<div class="repeat"><div class="repeat-head"><span class="pill">Service ${i+1}</span></div><div class="grid">${field(p+'.label','Small label')}${field(p+'.title','Title')}${field(p+'.description','Description','textarea',true)}</div></div>`}
function newsBlock(i){const p=`news.${i}`;return `<div class="repeat"><div class="repeat-head"><span class="pill">News ${i+1}</span></div><div class="grid">${field(p+'.title','Article title','textarea',true)}${imageField(p+'.image','Article image')}</div></div>`}
function render(){
 const pages=document.getElementById('pages');pages.innerHTML='';
 const general=card('General Website',`<div class="grid">${field('meta.title','Browser title')}${field('meta.description','SEO description','textarea')}${field('meta.companyMain','Header company name')}${field('meta.companySub','Header company suffix')}${field('footer.copyright','Footer copyright','text',true)}</div>`);
 const hero=card('Hero Section',`<div class="grid">${field('hero.eyebrow','Eyebrow', 'text',true)}${field('hero.titleHtml','Main title (HTML allowed)','textarea',true)}${field('hero.description','Description','textarea',true)}${imageField('hero.image','Hero background image')}${field('hero.metaLeftHtml','Left meta (HTML allowed)','textarea')}${field('hero.metaRightHtml','Right meta (HTML allowed)','textarea')}</div>`);
 const projects=card('Projects Section Heading',`<div class="grid">${field('projectsSection.kicker','Kicker')}${field('projectsSection.titleHtml','Title (HTML allowed)','textarea')}${field('projectsSection.note','Intro','textarea',true)}</div>`)+card('Project Items',data.projects.map((_,i)=>projectBlock(i)).join(''))+card('Project Details Heading',`<div class="grid">${field('projectDetailsSection.kicker','Kicker')}${field('projectDetailsSection.titleHtml','Title (HTML allowed)','textarea')}${field('projectDetailsSection.note','Intro','textarea',true)}</div>`);
 const about=card('About Us',`<div class="grid">${imageField('about.image','About image')}${field('about.kicker','Kicker')}${field('about.titleHtml','Title (HTML allowed)','textarea')}${field('about.paragraph1','Paragraph 1','textarea',true)}${field('about.paragraph2','Paragraph 2','textarea',true)}${field('about.missionTitle','Mission title')}${field('about.missionText','Mission text','textarea')}${field('about.linkText','Bottom link text','text',true)}</div>`);
 const services=card('Services Section Heading',`<div class="grid">${field('servicesSection.kicker','Kicker')}${field('servicesSection.titleHtml','Title (HTML allowed)','textarea')}${field('servicesSection.note','Intro','textarea',true)}</div>`)+card('Services',data.services.map((_,i)=>serviceBlock(i)).join(''));
 const news=card('Latest News Heading',`<div class="grid">${field('newsSection.kicker','Kicker')}${field('newsSection.titleHtml','Title (HTML allowed)','textarea')}${field('newsSection.intro','Intro','textarea',true)}${field('newsSection.moreTitle','More news heading','text',true)}</div>`)+card('News Articles',data.news.map((_,i)=>newsBlock(i)).join(''))+card('News Article Body',`<p class="hint">The current site uses one shared article body template for all news cards. You can edit those six paragraphs here.</p><div class="grid one">${data.newsArticleParagraphs.map((_,i)=>field('newsArticleParagraphs.'+i,'Paragraph '+(i+1),'textarea',true)).join('')}</div>`);
 const contact=card('Contact & Location',`<div class="grid">${field('contact.kicker','Kicker')}${field('contact.titleHtml','Title (HTML allowed)','textarea')}${field('contact.note','Intro','textarea',true)}${field('contact.companyName','Company name')}${field('contact.office','Office location')}${field('contact.phone','Phone')}${field('contact.email','Email')}${field('contact.hoursHtml','Business hours (HTML allowed)','textarea',true)}${field('contact.whatsapp','WhatsApp number')}${field('contact.whatsappMessage','WhatsApp default message','textarea')}${field('contact.mapQuery','Google Maps search')}${field('contact.mapLabel','Map label')}</div>`);
 const dashboard=`<div class="dashboard-grid"><div class="metric"><div class="metric-top"><div class="metric-icon">▦</div></div><div class="num">${data.projects?.length||0}</div><div class="label">Projects managed</div></div><div class="metric"><div class="metric-top"><div class="metric-icon">◆</div></div><div class="num">${data.services?.length||0}</div><div class="label">Services listed</div></div><div class="metric"><div class="metric-top"><div class="metric-icon">▤</div></div><div class="num">${data.news?.length||0}</div><div class="label">News articles</div></div><div class="metric"><div class="metric-top"><div class="metric-icon">✓</div></div><div class="num">Live</div><div class="label">Website status</div></div></div><div class="quick-grid">${card('Quick Edit',`<div class="quick-list"><button class="quick-link" onclick="show('hero')"><b>Hero Section</b><span>Title, wording and hero image</span></button><button class="quick-link" onclick="show('projects')"><b>Projects</b><span>Project titles, details and images</span></button><button class="quick-link" onclick="show('services')"><b>Services</b><span>Service names and descriptions</span></button><button class="quick-link" onclick="show('contact')"><b>Contact Details</b><span>Phone, email, WhatsApp and map</span></button></div>`,'Open the most commonly updated website sections.')}${card('Publishing','<div class="section-note">Changes remain in the admin until you click <b>Save & Publish</b>. The public website layout and design are protected.</div><div class="hint">Tip: Upload images directly from your device. Recommended landscape images should be clear and optimized before uploading.</div>','Safe content management')}</div>`;
 const contents={dashboard,general,hero,projects,about,services,news,contact};
 pageDefs.forEach(([id])=>{const d=document.createElement('div');d.className='page'+(id==='dashboard'?' active':'');d.dataset.page=id;d.innerHTML=contents[id];pages.appendChild(d)});
 bindInputs();
}
function markDirty(){const st=document.getElementById('publishState');st.classList.add('unsaved');st.querySelector('span:last-child').textContent='Unsaved changes'}
function bindInputs(){document.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('input',()=>{set(el.dataset.path,el.value);markDirty();const p=document.querySelector(`[data-preview="${CSS.escape(el.dataset.path)}"]`);if(p){p.src=el.value;p.style.display=el.value?'block':'none'}}));document.querySelectorAll('[data-upload-path]').forEach(el=>el.addEventListener('change',()=>uploadImage(el)))}
function nav(){const a=document.getElementById('desktopNav'),b=document.getElementById('mobileNav');pageDefs.forEach(([id,label,icon],i)=>{for(const root of [a,b]){const x=document.createElement('button');x.innerHTML=root===a?`<span class="nav-icon">${icon}</span><span>${label}</span>`:label;x.dataset.go=id;if(i===0)x.classList.add('active');x.onclick=()=>show(id);root.appendChild(x)}})}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===id));document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));const m=pageMeta[id]||[id,''];document.getElementById('pageTitle').textContent=m[0];document.getElementById('pageDesc').textContent=m[1];document.getElementById('crumbPage').textContent=m[0];window.scrollTo({top:0,behavior:'smooth'})}
function authHeaders(extra={}){return {...extra,...(token?{'Authorization':'Bearer '+token}:{})}}
async function ensureToken(){if(token)return true;token=prompt('Enter admin token:')||'';if(!token)return false;sessionStorage.setItem('klc_admin_token',token);return true}
async function load(){const s=document.getElementById('status');s.className='status';s.textContent='Loading website content…';try{const r=await fetch(API,{cache:'no-store'});if(r.ok){const j=await r.json();data=deepMerge(structuredClone(defaults),j.content||{});}else data=structuredClone(defaults);}catch(e){data=structuredClone(defaults);s.textContent='Backend not connected yet. Showing current default content.'}render();if(!s.textContent.includes('not connected'))s.textContent='Content loaded. Changes are not public until you click Save & Publish.'}
async function save(){if(!(await ensureToken()))return;const s=document.getElementById('status');s.className='status';s.textContent='Publishing changes…';try{const r=await fetch(API,{method:'PUT',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({content:data})});if(!r.ok)throw new Error(await r.text());s.className='status ok';s.textContent='Published successfully. Your public website content is now up to date.';const st=document.getElementById('publishState');st.classList.remove('unsaved');st.querySelector('span:last-child').textContent='Published'}catch(e){s.className='status bad';s.textContent='Could not publish: '+e.message}}
async function uploadImage(input){if(!input.files?.[0])return;if(!(await ensureToken()))return;const s=document.getElementById('status');s.className='status';s.textContent='Uploading image…';const fd=new FormData();fd.append('file',input.files[0]);try{const r=await fetch(UPLOAD,{method:'POST',headers:authHeaders(),body:fd});if(!r.ok)throw new Error(await r.text());const j=await r.json();set(input.dataset.uploadPath,j.url);const text=document.querySelector(`[data-path="${CSS.escape(input.dataset.uploadPath)}"]`);if(text)text.value=j.url;const p=document.querySelector(`[data-preview="${CSS.escape(input.dataset.uploadPath)}"]`);if(p){p.src=j.url;p.style.display='block'}markDirty();s.className='status ok';s.textContent='Image uploaded. Click Save & Publish to apply it to the website.'}catch(e){s.className='status bad';s.textContent='Upload failed: '+e.message}}
document.getElementById('saveBtn').onclick=save;document.getElementById('saveBtn2').onclick=save;document.getElementById('saveBtnMobile').onclick=save;document.getElementById('reloadBtn').onclick=load;document.getElementById('reloadBtn2').onclick=load;nav();load();
</script></body></html>
