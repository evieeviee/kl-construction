ly important around structural openings, M&E routes, finishes, temporary works and handover zones. Resolving those items early helps reduce unnecessary rework and keeps the next phase more predictable.", "Quality checks form another important part of the process. Rather than waiting until the end of a project, inspections are more useful when they are carried out throughout the work. Materials can be checked before installation, completed areas can be reviewed before they are covered, and workmanship can be assessed against the agreed details. This approach helps the team correct small issues while they are still easy to manage.", "Safety and housekeeping also remain part of day-to-day delivery. Clear access routes, organised material storage and well-planned work areas make the site easier to manage and reduce unnecessary disruption between teams. When several work activities are happening at the same time, communication becomes particularly important. Short coordination discussions and clear responsibilities help everyone understand what can proceed safely and what must wait.", "Good project delivery is therefore a combination of planning, technical coordination and consistent follow-through. Visible progress matters, but the quality of the decisions behind that progress matters just as much. By keeping information current and reviewing the work in manageable stages, the project team can maintain better control over quality, programme and site conditions.", "The objective is straightforward: complete each stage with enough clarity that the next team can begin without avoidable uncertainty. That discipline supports a smoother construction process and a stronger final result. As the project continues, the same checks are repeated at the appropriate stages so that quality, safety and coordination remain part of the work from early construction through final handover."], "contact": {"kicker": "Contact Us", "titleHtml": "Talk to our<br>project team.", "note": "For project enquiries, site discussions or company information, contact KLConstruction directly.", "companyName": "KLConstruction Sdn Bhd", "office": "Klang, Selangor, Malaysia", "phone": "+60 12-345 6789", "email": "hello@klconstruction.com", "hoursHtml": "Monday – Saturday<br>9:00 AM – 6:00 PM", "whatsapp": "60123456789", "whatsappMessage": "Hi KLConstruction, I would like to enquire about a project.", "mapQuery": "Klang, Selangor, Malaysia", "mapLabel": "Klang, Selangor"}, "footer": {"copyright": "© {year} KL Construction Sdn Bhd. All rights reserved."}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function deepMerge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;if(a&&typeof a==='object'){const o={...a};for(const k in b||{})o[k]=deepMerge(a[k],b[k]);return o}return b===undefined?a:b}
function get(path){return path.split('.').reduce((o,k)=>o?.[k],data)}
function getFrom(obj,path){return path.split('.').reduce((o,k)=>o?.[k],obj)}
function set(path,val){const p=path.split('.');let o=data;p.slice(0,-1).forEach(k=>o=o[k]);o[p.at(-1)]=val}
function field(path,label,type='text',full=false){let v=get(path)??'';const isHtml=path.endsWith('Html');if(isHtml)v=String(v).replace(/<br\s*\/?>(\s*)/gi,'\n');return `<div class="field ${full?'full':''}"><label>${esc(label)}</label>${type==='textarea'?`<textarea data-path="${path}" data-html="${isHtml?'1':'0'}">${esc(v)}</textarea>`:`<input data-path="${path}" data-html="${isHtml?'1':'0'}" value="${esc(v)}">`}</div>`}
const imageSpecs={
 'hero.image':{ratio:'hero',size:'1920 × 1080 px',usage:'Wide hero background'},
 'about.image':{ratio:'about',size:'1200 × 900 px',usage:'About section image'},
 'project-card':{ratio:'card',size:'1200 × 900 px',usage:'Project card / listing'},
 'project-detail':{ratio:'detail',size:'1500 × 1000 px',usage:'Project detail image'},
 'news-image':{ratio:'news',size:'1600 × 1000 px',usage:'News card & article'}
};
function specFor(path){if(path==='hero.image')return imageSpecs['hero.image'];if(path==='about.image')return imageSpecs['about.image'];if(path.includes('.cardImage'))return imageSpecs['project-card'];if(path.includes('.detailImage'))return imageSpecs['project-detail'];if(path.startsWith('news.')&&path.endsWith('.image'))return imageSpecs['news-image'];return {ratio:'news',size:'1600 × 1000 px',usage:'Website image'}}
function imageField(path,label){const v=get(path)||'';const id='u_'+path.replace(/[^a-z0-9]/gi,'_');const sp=specFor(path);const published=publishedData?getFrom(publishedData,path)||'':'';const changed=v!==published;return `<div class="image-editor"><div class="image-control"><label>${esc(label)}</label><input type="hidden" data-path="${path}" value="${esc(v)}"><div class="image-row simple-upload"><label class="upload-btn" for="${id}">${v?'Replace image':'Upload image'}</label><input class="upload" id="${id}" type="file" accept="image/jpeg,image/png,image/webp" data-upload-path="${path}"></div><div class="image-spec"><span class="spec-chip">Best size: ${sp.size}</span><span class="spec-chip">${sp.usage}</span></div>${changed?'<div class="image-pending">● New image not published yet</div>':''}<div class="image-help">Large photos are automatically resized and compressed before upload.</div></div><div class="image-preview-box ratio-${sp.ratio}" data-preview-box="${path}">${v?`<img data-preview="${path}" src="${esc(v)}" alt="Preview">`:`<div class="image-placeholder" data-placeholder="${path}">No image</div>`}${changed?`<button type="button" class="image-undo" title="Undo image change" aria-label="Undo image change" onclick="undoImage('${path}')">×</button>`:''}</div></div>`}
function card(title,html,sub='',tools=''){return `<section class="card"><div class="card-header"><div><h2>${title}</h2>${sub?`<div class="card-sub">${sub}</div>`:''}</div>${tools?`<div>${tools}</div>`:''}</div>${html}</section>`}
function projectBlock(i){const p=`projects.${i}`,item=data.projects[i]||{};return `<details class="item-card" ${i===0?'open':''}><summary class="item-summary"><div class="item-summary-main"><span class="summary-number">${String(i+1).padStart(2,'0')}</span><div class="item-summary-text"><b>${esc(item.title||'Untitled project')}</b><span>${esc(item.location||'No location')}</span></div></div><div class="item-actions"><button type="button" class="icon-btn" title="Move up" onclick="event.preventDefault();event.stopPropagation();moveItem('projects',${i},-1)">↑</button><button type="button" class="icon-btn" title="Move down" onclick="event.preventDefault();event.stopPropagation();moveItem('projects',${i},1)">↓</button><button type="button" class="icon-btn" title="Duplicate" onclick="event.preventDefault();event.stopPropagation();duplicateItem('projects',${i})">⧉</button><button type="button" class="icon-btn delete" title="Delete project" onclick="event.preventDefault();event.stopPropagation();deleteItem('projects',${i})">×</button><span class="item-chevron">⌄</span></div></summary><div class="item-body grid">${field(p+'.title','Project title')}${field(p+'.location','Location')}${field(p+'.tag','Small label','text',true)}${field(p+'.description','Description','textarea',true)}${imageField(p+'.cardImage','Project card image')}${imageField(p+'.detailImage','Project detail image')}</div></details>`}
function serviceBlock(i){const p=`services.${i}`;return `<div class="repeat"><div class="repeat-head"><span class="pill">Service ${i+1}</span></div><div class="grid">${field(p+'.label','Small label')}${field(p+'.title','Title')}${field(p+'.description','Description','textarea',true)}</div></div>`}
function newsBlock(i){const p=`news.${i}`,item=data.news[i]||{};return `<details class="item-card" ${i===0?'open':''}><summary class="item-summary"><div class="item-summary-main"><span class="summary-number">${String(i+1).padStart(2,'0')}</span><div class="item-summary-text"><b>${esc(item.title||'Untitled news')}</b><span>News article</span></div></div><div class="item-actions"><button type="button" class="icon-btn" title="Move up" onclick="event.preventDefault();event.stopPropagation();moveItem('news',${i},-1)">↑</button><button type="button" class="icon-btn" title="Move down" onclick="event.preventDefault();event.stopPropagation();moveItem('news',${i},1)">↓</button><button type="button" class="icon-btn" title="Duplicate" onclick="event.preventDefault();event.stopPropagation();duplicateItem('news',${i})">⧉</button><button type="button" class="icon-btn delete" title="Delete news" onclick="event.preventDefault();event.stopPropagation();deleteItem('news',${i})">×</button><span class="item-chevron">⌄</span></div></summary><div class="item-body grid">${field(p+'.title','Article title','textarea',true)}${imageField(p+'.image','Article image')}</div></details>`}
function render(){
 const pages=document.getElementById('pages');pages.innerHTML='';
 const general=card('Company Details',`<div class="grid">${field('meta.companyMain','Company name')}${field('meta.companySub','Company suffix')}${field('footer.copyright','Footer copyright','text',true)}</div>`);
 const hero=card('Hero Section',`<div class="grid">${field('hero.eyebrow','Eyebrow', 'text',true)}${field('hero.titleHtml','Main title','textarea',true)}${field('hero.description','Description','textarea',true)}${imageField('hero.image','Hero background image')}${field('hero.metaLeftHtml','Left information','textarea')}${field('hero.metaRightHtml','Right information','textarea')}</div>`);
 const projects=card('Projects Section Heading',`<div class="grid">${field('projectsSection.kicker','Small heading')}${field('projectsSection.titleHtml','Title','textarea')}${field('projectsSection.note','Intro','textarea',true)}</div>`)+card('Projects',`<div class="manage-note">Click a project to edit it. You can add, duplicate, reorder or remove projects. The current website design supports up to 6 projects. Changes only go live after <b>Save & Publish</b>.</div>${data.projects.length?data.projects.map((_,i)=>projectBlock(i)).join(''):'<div class="empty-list">No projects yet. Add your first project.</div>'}`,'',`<button type="button" class="btn primary small" onclick="addProject()">＋ Add Project</button>`)+card('Project Details Heading',`<div class="grid">${field('projectDetailsSection.kicker','Small heading')}${field('projectDetailsSection.titleHtml','Title','textarea')}${field('projectDetailsSection.note','Intro','textarea',true)}</div>`);
 const about=card('About Us',`<div class="grid">${imageField('about.image','About image')}${field('about.kicker','Small heading')}${field('about.titleHtml','Title','textarea')}${field('about.paragraph1','Paragraph 1','textarea',true)}${field('about.paragraph2','Paragraph 2','textarea',true)}${field('about.missionTitle','Mission title')}${field('about.missionText','Mission text','textarea')}${field('about.linkText','Bottom link text','text',true)}</div>`);
 const services=card('Services Section Heading',`<div class="grid">${field('servicesSection.kicker','Small heading')}${field('servicesSection.titleHtml','Title','textarea')}${field('servicesSection.note','Intro','textarea',true)}</div>`)+card('Services',data.services.map((_,i)=>serviceBlock(i)).join(''));
 const news=card('Latest News Heading',`<div class="grid">${field('newsSection.kicker','Small heading')}${field('newsSection.titleHtml','Title','textarea')}${field('newsSection.intro','Intro','textarea',true)}${field('newsSection.moreTitle','More news heading','text',true)}</div>`)+card('News',`<div class="manage-note">Click an article to edit it. You can add, duplicate, reorder or remove news items. The current website design supports up to 10 news items.</div>${data.news.length?data.news.map((_,i)=>newsBlock(i)).join(''):'<div class="empty-list">No news yet. Add your first article.</div>'}`,'',`<button type="button" class="btn primary small" onclick="addNews()">＋ Add News</button>`)+card('News Article Body',`<div class="section-note">This is the shared article content currently used by the website news popup.</div><div class="grid one">${data.newsArticleParagraphs.map((_,i)=>field('newsArticleParagraphs.'+i,'Paragraph '+(i+1),'textarea',true)).join('')}</div>`);
 const contact=card('Contact & Location',`<div class="grid">${field('contact.kicker','Small heading')}${field('contact.titleHtml','Title','textarea')}${field('contact.note','Intro','textarea',true)}${field('contact.companyName','Company name')}${field('contact.office','Office location')}${field('contact.phone','Phone')}${field('contact.email','Email')}${field('contact.hoursHtml','Business hours','textarea',true)}${field('contact.whatsapp','WhatsApp number')}${field('contact.whatsappMessage','WhatsApp default message','textarea')}${field('contact.mapQuery','Map location')}${field('contact.mapLabel','Map display name')}</div>`);
 const dashboard=`<div class="quick-grid">${card('Website Sections',`<div class="quick-list"><button class="quick-link" onclick="show('hero')"><b>Hero</b><span>Homepage title, text and image</span></button><button class="quick-link" onclick="show('projects')"><b>Projects</b><span>Project information and images</span></button><button class="quick-link" onclick="show('about')"><b>About Us</b><span>Company profile and image</span></button><button class="quick-link" onclick="show('services')"><b>Services</b><span>Service titles and descriptions</span></button><button class="quick-link" onclick="show('news')"><b>Latest News</b><span>News titles, images and text</span></button><button class="quick-link" onclick="show('contact')"><b>Contact</b><span>Phone, email, WhatsApp and map</span></button></div>`)}${card('How to Update','<div class="section-note">Choose a section, make your changes, then click <b>Save & Publish</b>.</div><div class="hint">Images are automatically optimized before upload.</div>')}</div>`;
 const contents={dashboard,general,hero,projects,about,services,news,contact};
 pageDefs.forEach(([id])=>{const d=document.createElement('div');d.className='page';d.dataset.page=id;d.innerHTML=contents[id];pages.appendChild(d)});
 bindInputs();show(currentPage,false);
}
function refreshPage(page=currentPage){render();show(page,false)}
function addProject(){if(data.projects.length>=6){alert('This website layout supports up to 6 projects. You can edit, duplicate, reorder or remove the existing project slots.');return}data.projects.push({title:'New Project',location:'',tag:'',description:'',cardImage:'',detailImage:''});markDirty();currentPage='projects';refreshPage('projects');setTimeout(()=>{const items=document.querySelectorAll('[data-page="projects"] .item-card');items[items.length-1]?.setAttribute('open','')},0)}
function addNews(){if(data.news.length>=10){alert('This website layout supports up to 10 news items. You can edit, duplicate, reorder or remove the existing news slots.');return}data.news.push({title:'New News Update',image:''});markDirty();currentPage='news';refreshPage('news');setTimeout(()=>{const items=document.querySelectorAll('[data-page="news"] .item-card');items[items.length-1]?.setAttribute('open','')},0)}
function moveItem(type,index,delta){const arr=data[type];const to=index+delta;if(!Array.isArray(arr)||to<0||to>=arr.length)return;[arr[index],arr[to]]=[arr[to],arr[index]];markDirty();refreshPage(type==='projects'?'projects':'news')}
function duplicateItem(type,index){const arr=data[type];if(!Array.isArray(arr)||!arr[index])return;const copy=structuredClone(arr[index]);if(type==='projects')copy.title=(copy.title||'Project')+' Copy';else copy.title=(copy.title||'News')+' Copy';arr.splice(index+1,0,copy);markDirty();refreshPage(type==='projects'?'projects':'news')}
function deleteItem(type,index){const label=type==='projects'?'project':'news item';if(!confirm(`Remove this ${label}? It will only disappear from the live website after Save & Publish.`))return;data[type].splice(index,1);markDirty();refreshPage(type==='projects'?'projects':'news')}
function undoImage(path){const old=publishedData?getFrom(publishedData,path)||'':'';set(path,old);markDirty();refreshPage(currentPage);const s=document.getElementById('status');s.className='status';s.textContent=old?'Image change undone.':'New image removed. Click Save & Publish if you made other changes.'}
function markDirty(){const st=document.getElementById('publishState');st.classList.add('unsaved');st.querySelector('span:last-child').textContent='Unsaved changes'}
function updatePreview(path,url){const box=document.querySelector(`[data-preview-box="${CSS.escape(path)}"]`);if(!box)return;if(url)box.innerHTML=`<img data-preview="${path}" src="${url}" alt="Preview">`;else box.innerHTML=`<div class="image-placeholder" data-placeholder="${path}">Image preview</div>`}
function bindInputs(){document.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('input',()=>{const value=el.dataset.html==='1'?el.value.replace(/\n/g,'<br>'):el.value;set(el.dataset.path,value);markDirty()}));document.querySelectorAll('[data-upload-path]').forEach(el=>el.addEventListener('change',()=>uploadImage(el)))}
function nav(){const a=document.getElementById('desktopNav'),b=document.getElementById('mobileNav');pageDefs.forEach(([id,label,icon],i)=>{for(const root of [a,b]){const x=document.createElement('button');x.innerHTML=root===a?`<span class="nav-icon">${icon}</span><span>${label}</span>`:label;x.dataset.go=id;if(i===0)x.classList.add('active');x.onclick=()=>show(id);root.appendChild(x)}})}
function show(id,scroll=true){currentPage=id;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===id));document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));const m=pageMeta[id]||[id,''];document.getElementById('pageTitle').textContent=m[0];document.getElementById('pageDesc').textContent=m[1];document.getElementById('crumbPage').textContent=m[0];if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function authHeaders(extra={}){return {...extra,...(token?{'Authorization':'Bearer '+token}:{})}}
async function verifyToken(candidate){const r=await fetch(AUTH,{method:'POST',headers:{'Authorization':'Bearer '+candidate,'Content-Type':'application/json'}});return r.ok}
function unlock(){document.body.classList.remove('auth-locked');document.getElementById('loginScreen').classList.add('hidden')}
function lock(){token='';sessionStorage.removeItem('klc_admin_token');document.body.classList.add('auth-locked');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('loginPassword').value='';document.getElementById('loginMsg').textContent=''}
async function loginWith(candidate){const msg=document.getElementById('loginMsg');msg.textContent='Checking password…';try{if(!(await verifyToken(candidate))){msg.textContent='Incorrect password. Please try again.';return false}token=candidate;sessionStorage.setItem('klc_admin_token',token);msg.textContent='';unlock();await load();return true}catch(e){msg.textContent='Unable to connect to the admin service.';return false}}
async function ensureToken(){if(!token){lock();return false}try{if(await verifyToken(token))return true}catch(e){}lock();return false}
async function load(){const s=document.getElementById('status');s.className='status';s.textContent='Loading website content…';try{const r=await fetch(API,{cache:'no-store'});if(r.ok){const j=await r.json();data=deepMerge(structuredClone(defaults),j.content||{});publishedData=structuredClone(data);}else data=structuredClone(defaults);publishedData=structuredClone(data);}catch(e){data=structuredClone(defaults);publishedData=structuredClone(data);s.textContent='Unable to load saved content.'}render();if(!s.textContent.includes('not connected'))s.textContent='Ready to edit. Changes go live after Save & Publish.'}
async function save(){if(!(await ensureToken()))return;const s=document.getElementById('status');s.className='status';s.textContent='Publishing changes…';try{const r=await fetch(API,{method:'PUT',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({content:data})});if(!r.ok)throw new Error(await r.text());s.className='status ok';s.textContent='Published successfully.';publishedData=structuredClone(data);refreshPage(currentPage);const st=document.getElementById('publishState');st.classList.remove('unsaved');st.querySelector('span:last-child').textContent='Published'}catch(e){s.className='status bad';s.textContent='Could not publish: '+e.message}}
function fmtBytes(n){if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(0)+' KB';return (n/1024/1024).toFixed(1)+' MB'}
function targetFor(path){const sp=specFor(path);const m=sp.size.match(/(\d+)\s*×\s*(\d+)/);return m?{w:+m[1],h:+m[2]}:{w:1600,h:1000}}
async function canvasBlob(canvas,type,quality){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Unable to optimize image')),type,quality))}
async function optimizeImage(file,path){if(!file.type.startsWith('image/'))throw new Error('Please choose a JPG, PNG or WebP image.');const target=targetFor(path);let bitmap;try{bitmap=await createImageBitmap(file)}catch(e){throw new Error('This image format could not be opened. Please use JPG, PNG or WebP.')}const scale=Math.min(1,target.w/bitmap.width,target.h/bitmap.height);const w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:false});ctx.drawImage(bitmap,0,0,w,h);bitmap.close?.();let quality=.84;let blob=await canvasBlob(canvas,'image/webp',quality);const maxBytes=path==='hero.image'?550*1024:380*1024;while(blob.size>maxBytes&&quality>.60){quality-=.06;blob=await canvasBlob(canvas,'image/webp',quality)}return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'image')+'.webp',{type:'image/webp'});}
async function uploadImage(input){if(!input.files?.[0])return;if(!(await ensureToken()))return;const s=document.getElementById('status');const original=input.files[0];s.className='status';s.textContent='Optimizing image…';try{const optimized=await optimizeImage(original,input.dataset.uploadPath);s.textContent='Uploading optimized image…';const fd=new FormData();fd.append('file',optimized);const r=await fetch(UPLOAD,{method:'POST',headers:authHeaders(),body:fd});if(!r.ok)throw new Error(await r.text());const j=await r.json();set(input.dataset.uploadPath,j.url);const hidden=document.querySelector(`[data-path="${CSS.escape(input.dataset.uploadPath)}"]`);if(hidden)hidden.value=j.url;updatePreview(input.dataset.uploadPath,j.url);markDirty();s.className='status ok';s.textContent=`Image ready — ${fmtBytes(original.size)} → ${fmtBytes(optimized.size)}. Click Save & Publish.`;input.value=''}catch(e){s.className='status bad';s.textContent='Upload failed: '+e.message}}
document.getElementById('saveBtn').onclick=save;document.getElementById('saveBtn2').onclick=save;document.getElementById('saveBtnMobile').onclick=save;document.getElementById('reloadBtn').onclick=load;document.getElementById('reloadBtn2').onclick=load;document.getElementById('logoutBtn').onclick=lock;
document.getElementById('passwordToggle').onclick=()=>{const x=document.getElementById('loginPassword');x.type=x.type==='password'?'text':'password'};
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('loginPassword').value.trim();if(p)await loginWith(p)};
nav();document.body.classList.add('auth-locked');if(token){verifyToken(token).then(ok=>{if(ok){unlock();load()}else lock()}).catch(lock)}else lock();
